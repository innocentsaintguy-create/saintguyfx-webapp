<!DOCTYPE html>
<html>
<head>
  <title>XAU EDGE Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>XAU EDGE</h1>
  <p>Gold Trading Dashboard</p>
</header>

<div class="dashboard">

  <div class="card">
    <h3>Market</h3>
    <p>XAU/USD</p>
  </div>

  <div class="card">
    <h3>Trend</h3>
    <p id="trend">Waiting...</p>
  </div>

  <div class="card">
    <h3>Signal</h3>
    <p id="signal">No Signal</p>
  </div>

  <div class="card">
    <h3>Risk</h3>
    <p>Low</p>
  </div>

</div>

<div class="signal-box">
  <h2>Latest XAU EDGE Signal</h2>

  <div class="trade-card">
    <h3>Market: XAU/USD</h3>
    <p>Direction: <span id="tradeDirection">BUY 🟢</span></p>
    <p>Entry: <span id="entry">--</span></p>
    <p>Stop Loss: <span id="stoploss">--</span></p>
    <p>Take Profit: <span id="takeprofit">--</span></p>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
