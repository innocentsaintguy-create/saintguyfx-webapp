<!DOCTYPE html>
<html>
<head>
  <title>XAU EDGE Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>XAU EDGE</h1>
  <p>Gold Trading Dashboard</p>
</header>

<div class="dashboard">

  <div class="card">
    <h3>Market</h3>
    <p>XAU/USD</p>
  </div>

  <div class="card">
    <h3>Trend</h3>
    <p id="trend">Waiting...</p>
  </div>

  <div class="card">
    <h3>Signal</h3>
    <p id="signal">No Signal</p>
  </div>

  <div class="card">
    <h3>Risk</h3>
    <p>Low</p>
  </div>

</div>

<div class="signal-box">
  <h2>Latest XAU EDGE Signal</h2>
  <p>BUY / SELL analysis will appear here</p>
</div>

<script src="script.js"></script>

</body>
</html>
